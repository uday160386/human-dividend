# Site settings for Human Dividend
title: Human Dividend
tagline: What AI gave back
description: A monthly record of documented cases where AI made a real difference to ordinary people, with how each was done.
url: "https://uday160386.github.io"
baseurl: "/human-dividend"   # repo name: the site lives at /human-dividend/
fonts_url: "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap"

# Every page uses the default layout unless it says otherwise
defaults:
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - _templates